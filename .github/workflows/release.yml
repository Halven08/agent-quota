name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Releases are intentionally available only after the repository is public,
    # when standard GitHub-hosted runners no longer consume included minutes.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            artifact: agent-quota-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact: agent-quota-windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            artifact: agent-quota-macos-x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            artifact: agent-quota-macos-aarch64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - name: Install target
        run: rustup target add ${{ matrix.target }} --toolchain 1.88
      - name: Build
        run: cargo build --release --locked -p agent-quota --target ${{ matrix.target }}
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C "target/${{ matrix.target }}/release" agent-quota
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/agent-quota.exe" -DestinationPath "${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: agent-quota-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd artifacts
          sha256sum agent-quota-* > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" ./* --generate-notes --verify-tag
