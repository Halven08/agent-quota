# Profiles contain labels and local paths only. Never place OAuth tokens or API
# keys in this file.

[[profiles]]
id = "claude-private"
provider = "claude"
label = "Claude Private"
credentials_path = "C:/Users/you/.claude-private/.credentials.json"

[[profiles]]
id = "claude-work"
provider = "claude"
label = "Claude Work"
credentials_path = "C:/Users/you/.claude-work/.credentials.json"

[[profiles]]
id = "codex-private"
provider = "codex"
label = "Codex Private"
enabled = true

# Codex receives these overrides when Agent Quota starts its app-server.
[profiles.env]
CODEX_HOME = "C:/Users/you/.codex-private"
